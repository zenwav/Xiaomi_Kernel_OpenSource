name: Build Dash Kernel with KSU & SUSFS

permissions:
  contents: write

on:
  workflow_dispatch:

env:
  CLANG_DIR: toolchain/clang-r510928
  CLANG_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-15.0.0_r1/clang-r510928.tar.gz"
  LOCALVERSION: ""

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          rm_cmd: "rmz"        
          rmz_version: "3.2.0" 
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            dwarves cpio lz4 zstd ccache python3 git curl ca-certificates xz-utils \
            rsync openssl zip kmod

      - name: Checkout kernel source
        uses: actions/checkout@v7

      - name: Cache AOSP clang r510928
        id: clang-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.CLANG_DIR }}
          key: aosp-clang-r510928

      - name: Download AOSP clang r510928
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$CLANG_DIR"
          curl -L --retry 5 --retry-delay 5 -o /tmp/clang.tar.gz "$CLANG_URL"
          tar -xzf /tmp/clang.tar.gz -C "$CLANG_DIR"
          rm -f /tmp/clang.tar.gz
          if [ ! -x "$CLANG_DIR/bin/clang" ] && [ -x "$CLANG_DIR/clang-r510928/bin/clang" ]; then
            mv "$CLANG_DIR/clang-r510928"/* "$CLANG_DIR"/
            rmdir "$CLANG_DIR/clang-r510928"
          fi

      - name: Verify toolchain
        run: |
          test -x "$CLANG_DIR/bin/clang"
          "$CLANG_DIR/bin/clang" --version | head -2

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-dash-${{ github.run_number }}
          restore-keys: ccache-dash-

      - name: Integrate KernelSU-Next (pershoot dev-susfs)
        run: |
          set -euo pipefail
          # Fetch and run setup.sh to mount KSU into the tree
          curl -LSs --retry 5 "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
          # Fetch and apply static.patch
          curl -L --retry 5 -o /tmp/ksu-static.patch "https://raw.githubusercontent.com/WildKernels/GKI_KernelSU_SUSFS/main/.github/actions/kernelsu/patches/static.patch"
          cd KernelSU-Next
          patch -p1 < /tmp/ksu-static.patch
          cd ..

      - name: Integrate SUSFS
        run: |
          set -euo pipefail
          git clone --depth 1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android15-6.6 susfs4ksu
          git clone --depth 1 https://github.com/WildKernels/kernel_patches.git kernel_patches

          # Apply pershoot compatibility patches to SUSFS
          cd susfs4ksu
          patch -p1 < ../kernel_patches/pershoot/susfs4ksu/0001-pershoot-Allow-core-to-be-built-with-no-features.patch
          patch -p1 < ../kernel_patches/pershoot/susfs4ksu/0002-pershoot-Implement-SuSFS-and-Toolkit-coexistence.patch
          cd ..

          # Copy files into kernel tree
          cp susfs4ksu/kernel_patches/fs/* fs/
          cp susfs4ksu/kernel_patches/include/linux/* include/linux/
          cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch .

          # dma-buf guard (Injects required context for the patch)
          DMABUF_GUARD=0
          if ! grep -q '^#include <linux/dma-buf.h>$' fs/proc/base.c; then
            sed -i '/^#include <linux\/cpufreq_times.h>$/a #include <linux/dma-buf.h>' fs/proc/base.c
            DMABUF_GUARD=1
          fi

          # Apply main SUSFS patch
          patch -p1 --forward < 50_add_susfs_in_gki-android15-6.6.patch

          # Revert dma-buf guard line so it matches stock behavior
          if [ "$DMABUF_GUARD" = "1" ]; then
            sed -i '/^#include <linux\/dma-buf.h>$/d' fs/proc/base.c
          fi
          rm 50_add_susfs_in_gki-android15-6.6.patch

      - name: Configure kernel
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          export KBUILD_BUILD_USER="kleaf"
          export KBUILD_BUILD_HOST="build-host"
          export ARCH="arm64"
          # Run gki_defconfig which automatically reads your local config changes
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="ccache clang" gki_defconfig

      - name: Build kernel
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          export CCACHE_DIR="${{ github.workspace }}/.ccache"
          export CCACHE_MAXSIZE="4G"
          export KBUILD_BUILD_USER="kleaf"
          export KBUILD_BUILD_HOST="build-host"
          export ARCH="arm64"
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="ccache clang" -j"$(nproc --all)" Image.lz4

      - name: Stage release files
        run: |
          mkdir -p release
          cp out/arch/arm64/boot/Image release/Image
          cp out/arch/arm64/boot/Image.lz4 release/Image.lz4
          cp out/.config release/config-dash-r${{ github.run_number }}.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dash-r${{ github.run_number }}
          name: "Dash Kernel Release (r${{ github.run_number }})"
          prerelease: true
          files: release/*